# Host nginx for the Oracle VM: password + HTTPS in front of the app containers.
#
#   sudo cp deploy/oracle-nginx.conf /etc/nginx/sites-available/archie
#   sudo sed -i 's/archie-itac.duckdns.org/YOUR_DOMAIN/' /etc/nginx/sites-available/archie
#   sudo ln -s /etc/nginx/sites-available/archie /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN
#
# Everything goes to the frontend container on 127.0.0.1:8080, which already routes
# /api to the backend. Do not split /api off to the backend here: that skips the
# container's streaming settings.

server {
    listen 80;
    server_name archie-itac.duckdns.org;

    # A year of scanned bills in one upload; 1m (the default) rejects it with 413.
    client_max_body_size 500m;

    auth_basic "ARchie";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Without this, chat replies arrive all at once instead of word by word.
        proxy_buffering off;
        proxy_cache off;
        # A bill run or a long answer can take many minutes.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
