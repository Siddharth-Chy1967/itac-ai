server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API + SSE chat streaming -> backend container. proxy_buffering off (plus HTTP/1.1
    # and a cleared Connection header) is what lets /api/chat tokens arrive incrementally
    # instead of being buffered until the stream closes.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # SPA history-mode fallback: unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
