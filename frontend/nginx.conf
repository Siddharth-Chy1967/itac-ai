server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API + SSE chat streaming -> backend container. proxy_buffering off (plus HTTP/1.1
    # and a cleared Connection header) is what lets /api/chat tokens arrive incrementally
    # instead of being buffered until the stream closes.
    location /api/ {
        # Bulk utility-bill uploads: dozens of scanned PDFs in one request.
        # nginx defaults to 1m, which rejects them with 413 before the backend sees them.
        client_max_body_size 500m;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # SPA history-mode fallback: unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The page itself is never cached, so a rebuild shows at once instead of the old
    # page (and old name) lingering until a hard refresh. The hashed files under
    # /assets/ change name on every build and stay cacheable.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
