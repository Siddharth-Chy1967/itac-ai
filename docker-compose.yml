# ITAC AI — one-command launch.
#
#   docker compose up --build          # start (rebuild if code changed)
#   docker compose up -d --build       # start detached
#   docker compose down                # stop
#
# Then open http://localhost:8080
#
# The private corpus (data/, ~800MB chroma DB) and secrets (.env) stay on the host and
# are bind-mounted / injected at runtime — they are never baked into an image.

services:
  backend:
    build:
      context: .                     # repo root: the image needs backend/ AND skills/
      dockerfile: backend/Dockerfile
    env_file:
      - .env                         # provider selection + API keys, as on the host
    environment:
      # Inside a container, localhost is the container, not your PC. If you run Ollama
      # on the host (the default provider here), reach it via the host gateway. Harmless
      # when the provider is Gemini/Anthropic (nothing connects to it).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # .env's relative ./data/bills resolves under /srv/backend, outside the ./data
      # mount; pin both onto it so workbooks and the answer cache survive on the host.
      BILLS_PATH: /srv/data/bills
      BILLS_CACHE_PATH: /srv/data/bill_cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/srv/data             # chroma DB, reports, uploads, exports persist here
      - hf-cache:/srv/hf-cache       # embedding model download, cached across rebuilds
    expose:
      - "8000"                       # internal only; the frontend proxies to it
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Loading torch, the embedding model and Chroma takes well over 40s on a small
      # cloud CPU; the frontend waits for "healthy" and would never start.
      start_period: 180s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      # Bound to 127.0.0.1: only this machine (or the host nginx in front of it on a
      # server) can reach the app, so nobody gets around that nginx's password.
      - "127.0.0.1:8080:80"          # the app: http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hf-cache:
