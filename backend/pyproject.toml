[project]
name = "itac-ai-backend"
version = "0.1.0"
description = "ITAC AI Assistant backend (FastAPI, provider-agnostic LLM layer, RAG, xlsx engine)"
requires-python = ">=3.11"
dependencies = [
    # Session A: config + LLM layer + FastAPI SSE
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    # Session B: skills loader + router
    "pyyaml>=6",
    # Session C: xlsx engine (deterministic TableSpec -> .xlsx renderer)
    "openpyxl>=3.1",
    # Session D: RAG ingest (docx extraction, embeddings, vector store)
    "python-docx>=1.1",
    "sentence-transformers>=2.6,<6",
    # nomic-embed-text-v1.5's remote model code calls
    # PreTrainedModel.get_extended_attention_mask, which transformers removed after
    # the 5.13 series; newer versions break every embedding call (seen in a fresh
    # Docker build that resolved 5.17). Verified working: transformers 5.13.1.
    "transformers<5.14",
    "einops>=0.7",  # required by nomic-embed-text-v1.5's remote model code
    "chromadb>=0.5",
    # Session E: ARC reference lookup (parses the official ARC list PDF)
    "pypdf>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
